<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | Freelance Project Tracking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="tasks">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Freelance Tracker</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/clients">Clients</a>
        <a class="nav-link" href="/projects">Projects</a>
        <a class="nav-link active" href="/tasks">Tasks</a>
        <a class="nav-link" href="/payments">Payments</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="page-header">
      <h1 class="page-title">Tasks</h1>
      <button class="btn btn-primary" id="addBtn">Add Task</button>
    </div>
    <div class="toolbar">
      <label class="form-label" for="statusFilter">Status</label>
      <select class="form-select" id="statusFilter">
        <option value="">All</option>
        <option>Pending</option>
        <option>In Progress</option>
        <option>Completed</option>
      </select>
    </div>
    <div id="message" class="message"></div>

    <section class="form-panel d-none" id="formPanel">
      <h2 id="formTitle">Add Task</h2>
      <form id="entityForm">
        <input type="hidden" id="TaskID">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" id="Title" required></div>
          <div class="col-md-6"><label class="form-label">Project</label><select class="form-select" id="ProjectID" required></select></div>
          <div class="col-md-12"><label class="form-label">Description</label><textarea class="form-control" id="Description"></textarea></div>
          <div class="col-md-6"><label class="form-label">Deadline</label><input class="form-control" id="Deadline" type="date"></div>
          <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" id="Status" required><option>Pending</option><option>In Progress</option><option>Completed</option></select></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-success" type="submit">Save</button>
          <button class="btn btn-secondary" type="button" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </section>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead><tr><th>TaskID</th><th>Title</th><th>Project Title</th><th>Status</th><th>Deadline</th><th>Actions</th></tr></thead>
        <tbody id="tasksBody"></tbody>
      </table>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
