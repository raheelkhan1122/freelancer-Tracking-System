<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients | Freelance Project Tracking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="clients">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Freelance Tracker</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link active" href="/clients">Clients</a>
        <a class="nav-link" href="/projects">Projects</a>
        <a class="nav-link" href="/tasks">Tasks</a>
        <a class="nav-link" href="/payments">Payments</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="page-header">
      <h1 class="page-title">Clients</h1>
      <button class="btn btn-primary" id="addBtn">Add Client</button>
    </div>
    <div id="message" class="message"></div>

    <section class="form-panel d-none" id="formPanel">
      <h2 id="formTitle">Add Client</h2>
      <form id="entityForm">
        <input type="hidden" id="ClientID">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Name</label><input class="form-control" id="Name" required></div>
          <div class="col-md-4"><label class="form-label">Email</label><input class="form-control" id="Email" required></div>
          <div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" id="Phone"></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-success" type="submit">Save</button>
          <button class="btn btn-secondary" type="button" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </section>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead><tr><th>ClientID</th><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
        <tbody id="clientsBody"></tbody>
      </table>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
