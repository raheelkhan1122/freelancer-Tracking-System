<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Freelance Project Tracking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="dashboard">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">Freelance Tracker</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="/">Dashboard</a>
        <a class="nav-link" href="/clients">Clients</a>
        <a class="nav-link" href="/projects">Projects</a>
        <a class="nav-link" href="/tasks">Tasks</a>
        <a class="nav-link" href="/payments">Payments</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="page-title">Dashboard</h1>
    <div id="message" class="message"></div>

    <section class="row g-3 mb-4" id="statsCards">
      <div class="col-md-3"><div class="stat-card"><span>Total Clients</span><strong id="totalClients">0</strong></div></div>
      <div class="col-md-3"><div class="stat-card"><span>Total Projects</span><strong id="totalProjects">0</strong></div></div>
      <div class="col-md-3"><div class="stat-card"><span>Total Tasks</span><strong id="totalTasks">0</strong></div></div>
      <div class="col-md-3"><div class="stat-card"><span>Total Payments Collected</span><strong id="totalEarned">$0.00</strong></div></div>
    </section>

    <section class="row g-4">
      <div class="col-lg-6">
        <h2 class="section-title">Recent Projects</h2>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead><tr><th>Project</th><th>Client</th><th>Status</th><th>Deadline</th></tr></thead>
            <tbody id="recentProjectsBody"></tbody>
          </table>
        </div>
      </div>
      <div class="col-lg-6">
        <h2 class="section-title">Recent Payments</h2>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead><tr><th>Project</th><th>Amount</th><th>Status</th><th>Method</th></tr></thead>
            <tbody id="recentPaymentsBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
